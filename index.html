<!-- index.html -->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>몰ep</title>
    <style>
      body {
        margin: 0;
        background-color: #1a1a18;
      }

      /* 폰 화면 크기의 로딩 화면: 내용을 세로로 쌓고 정중앙에 배치 */
      .loading {
        width: 390px;
        max-width: 100%;
        height: 100vh;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background-color: #f7f6f2;
        color: #1a1a18;
      }

      .loading-logo {
        margin: 0;
        font-size: 36px;
      }

      .loading-logo span {
        font-size: 22px;
        font-weight: normal;
      }

      /* 스피너: 테두리 한 쪽만 색을 다르게 한 원을 회전시킨다 */
      .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #dddcd6; /* 연한 회색 바탕 링 */
        border-top-color: #d96a2b; /* 위쪽만 주황색 -> 도는 호 */
        border-radius: 50%; 
        animation: spin 0.9s linear infinite;
      }

      .loading-text {
        margin: 0;
        font-size: 15px;
        color: #55544f;
      }

      /* 글자 뒤에 점(.)을 붙이고, 점 개수를 애니메이션으로 바꾼다 */
      .loading-text::after {
        content: "";
        animation: dots 1.5s steps(4, end) infinite; /* 4단계로 끊어서 변경 */
      }

      /* spin: 0도(기본)에서 360도까지 한 바퀴 회전 */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* dots: 구간마다 점이 0개 -> 1개 -> 2개 -> 3개로 늘어남 */
      @keyframes dots {
        0% { content: ""; }
        25% { content: "."; }
        50% { content: ".."; }
        75% { content: "..."; }
      }
    </style>
  </head>
  <body>
    <script type="module">
      import config from "/js/config.js";

      const { OPEN_WEATHER_API_KEY } = config;

      function getWeatherTheme(data) {
        const weather = data.weather[0].description;
        const id = data.weather[0].id;
        const humidity = data.main.humidity;

        console.log(data)
        console.log(weather, id, humidity);

        if (id === 800 || id === 801 || id === 802 || id === 803) return "sunny";
        else if (id === 804) return "cloudy";
        else return "rain";
      }

      const getSuccess = async (position) => {
        console.log(position);
        const lon = position.coords.longitude;
        const lat = position.coords.latitude;

        console.log(lon, lat);
        const OPEN_WEATHER_URL = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${OPEN_WEATHER_API_KEY}&units=metric&lang=kr`;

        console.log(OPEN_WEATHER_URL);

        try {
          const response = await fetch(OPEN_WEATHER_URL);
          if (!response.ok) {
            throw new Error(`에러 발생 ${response.status}`);
          }

          const data = await response.json();

          sessionStorage.setItem("WeatherData", JSON.stringify(data));
          const theme = getWeatherTheme(data);
          location.href = `${theme}.html`;
        } catch (e) {
          console.log("예외가 발생하였습니다. " + e);
        }
      };

      const getError = () => {
        console.log("Error 발생");
      };

      const options = {
        enableHighAccuracy: false, // 대략적인 위치로 확인
        timeout: 5000,
        maximumAge: 10 * 60 * 1000, // 10분 이내 캐시된 위치 재사용
      };

      window.navigator.geolocation.getCurrentPosition(
        getSuccess,
        getError,
        options,
      );
    </script>
    <div class="loading">
      <h1 class="loading-logo">몰<span>ep</span></h1>
      <div class="spinner"></div>
      <p class="loading-text">날씨 확인 중</p>
    </div>
  </body>
</html>
